                });
            });
            
            function updateGroupVisibility(group) {
                var currentZoom = map.getZoom();
                var showDetails = currentZoom >= group.targetZoom;
                
                // Проверяем, добавлена ли вообще группа на карту (включена ли в LayerControl)
                // Для этого проверим, есть ли хотя бы один элемент группы на карте или проверим родительский слой
                // Самый простой способ — управлять маркерами напрямую через map.addLayer / map.removeLayer
                
                if (showDetails) {
                    if (map.hasLayer(group.summary)) {
                        map.removeLayer(group.summary);
                    }
                    group.details.forEach(function(marker) {
                        if (!map.hasLayer(marker)) {
                            marker.addTo(map);
                        }
                    });
                } else {
                    group.details.forEach(function(marker) {
                        if (map.hasLayer(marker)) {
                            map.removeLayer(marker);
                        }
                    });
                    if (!map.hasLayer(group.summary)) {
                        group.summary.addTo(map);
                    }
                }
            }
            
            function updateAllMarkers() {
                groupsData.forEach(function(group) {
                    updateGroupVisibility(group);
                });
            }

                // Проверяем, относится ли включенный слой к нашим группам, и обновляем их
                setTimeout(updateAllMarkers, 50);
            });
            
            // Первичный запуск при загрузке
            updateAllMarkers();
            
            break;
