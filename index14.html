                var showDetails = currentZoom >= group.targetZoom;
                
                // Проверяем, добавлена ли вообще группа на карту (включена ли в LayerControl)

                if (showDetails) {
                    if (map.hasLayer(group.summary)) {
                        map.removeLayer(group.summary);
                    }
                    group.details.forEach(function(marker) {
                        if (!map.hasLayer(marker)) {

                        }
                    });
